[package]
name = "nu_plugin_connectorx"
version = "0.3.0"
edition = "2024"
description = "Load data from DBs in `nushell` using ConnectorX"
license = "MIT OR Apache-2.0"
exclude = ["./github"]
repository = "https://github.com/VasanthakumarV/nu_plugin_connectorx"
readme = "README.md"

[dependencies]
nu-plugin = "0.112.2"
nu-path = "0.112.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rootcause = "0.12.1"
rootcause-tracing = "0.12.1"

[dependencies.connectorx]
version = "0.4.5"
features = [
    "dst_arrow",
    "src_bigquery",
    "src_mssql",
    "src_mysql",
    "src_oracle",
    "src_postgres",
    "src_sqlite",
    "src_trino",
]

[dependencies.chrono]
default-features = false
version = "0.4.44"

[dependencies.nu-protocol]
version = "0.112.2"
features = ["plugin"]

[dependencies.parquet]
version = "58.3.0"
features = ["arrow"]

[dependencies.arrow]
version = "58.3.0"
features = ["chrono-tz"]

[dev-dependencies]
arrow-schema = "58.3.0"
nu-plugin-test-support = "0.112.2"
